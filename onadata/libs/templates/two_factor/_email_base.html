{% load i18n %}<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 0; background-color: #ffffff;">
  <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #1f2328; max-width: 600px; margin: 0 auto; padding: 24px 16px;">
    <p style="margin: 0 0 16px;">{% blocktranslate %}Hey {{ username }}!{% endblocktranslate %}</p>
    {% block body %}{% endblock %}
    <p style="margin: 24px 0 0;">{% translate "Thanks," %}<br>{% blocktranslate %}The {{ deployment_name }} Team{% endblocktranslate %}</p>
  </div>
</body>
</html>
